<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Owner Report">
  <meta name="robots" content="noindex">
  <title>Monday Owner Report</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f4fd8'/%3E%3Cpath d='M8 22V12l8 6 8-6v10' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <label class="picker">
        <span class="picker-label">Demo company</span>
        <select id="company" aria-label="Choose a demo company"></select>
      </label>
      <button id="print" class="print-btn" type="button" aria-label="Save as PDF">PDF</button>
    </div>
  </div>

  <main id="report" class="report" aria-live="polite">
    <noscript><p class="card">This report needs JavaScript turned on.</p></noscript>
  </main>

  <script src="data.js"></script>
  <script src="report.js"></script>
  <script>
    if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js");
  </script>
</body>
</html>
