<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0e13" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Owner Report">
  <meta name="robots" content="noindex">
  <meta name="description" content="Monday Owner Report demo: last week's numbers for a home-service business, in plain English. All data is fictional.">
  <title>Monday Owner Report</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Loading / error card, styled here so it shows even if styles.css doesn't load. */
    .boot { text-align: center; padding: 28px 20px; max-width: 520px; margin: 24px auto; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .boot-msg { font-weight: 650; font-size: 15px; margin: 0; }
    .boot-btn { margin-top: 12px; font: inherit; font-weight: 700; padding: 10px 22px; border-radius: 999px; border: 0; background: #3b5bdb; color: #fff; cursor: pointer; }
    .boot-hint { margin: 10px 0 0; font-size: 12.5px; opacity: .7; }
  </style>
</head>
<body>
  <header class="appbar">
    <div class="appbar-inner">
      <span class="brand"><span data-brand-logo></span><span class="brand-name" data-brand-name></span></span>
      <label class="switcher">
        <span class="sw-text">
          <span class="sw-label">Demo company</span>
          <span class="sw-value" id="company-label"></span>
        </span>
        <svg class="ico sw-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg>
        <select id="company" aria-label="Choose a demo company"></select>
      </label>
      <button id="print" class="icon-btn" type="button" aria-label="Save as PDF" title="Save as PDF">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 9V4h10v5"/><rect x="4" y="9" width="16" height="7" rx="1.5"/><path d="M7 14h10v6H7z"/></svg>
      </button>
    </div>
  </header>

  <main id="report" class="report">
    <div class="card boot" id="boot" role="status" aria-live="polite">
      <p class="boot-msg">Loading your report…</p>
    </div>
    <noscript><p class="card">This report needs JavaScript turned on.</p></noscript>
  </main>

  <script>
    // If the report can't start (a file didn't load, or the sign-in expired), say so instead of
    // leaving a blank page. report.js replaces #boot as soon as it renders.
    (function () {
      function stuck(msg) {
        var b = document.getElementById("boot");
        if (!b) return;
        b.innerHTML = '<p class="boot-msg">' + msg + '</p><button type="button" class="boot-btn" onclick="location.reload()">Reload</button>' +
          '<p class="boot-hint">If this keeps happening on a private report, open the link in Safari or Chrome (not inside another app) and sign in when asked.</p>';
      }
      window.__bootStuck = stuck;
      setTimeout(function () { stuck("Still loading. Your connection may be slow."); }, 10000);
    })();
  </script>
  <script src="data.js"></script>
  <script src="report.js"></script>
  <script>
    window.addEventListener("load", function () {
      if (document.getElementById("boot")) window.__bootStuck("The report didn't load.");
    });
    // Offline copy for the public demo only. A private report always loads fresh, so a cached copy
    // can never hide an expired sign-in or show last week's numbers.
    (function () {
      var demo = !!(window.REPORT_DATA && window.REPORT_DATA.meta && window.REPORT_DATA.meta.source === "demo");
      if (!("serviceWorker" in navigator) || !/^https?:$/.test(location.protocol)) return;
      if (demo) { if (location.protocol === "https:") navigator.serviceWorker.register("sw.js"); return; }
      function quiet() {}
      navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); }, quiet);
      if (window.caches) caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); }, quiet);
    })();
  </script>
</body>
</html>
